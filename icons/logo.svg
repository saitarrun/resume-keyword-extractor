<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="docShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="sparkleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FCD34D" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Resume Document Card -->
  <rect x="36" y="28" width="56" height="72" rx="8" fill="#FFFFFF" filter="url(#docShadow)"/>

  <!-- Document Header Bar (Blue Tech Pill) -->
  <rect x="46" y="38" width="28" height="6" rx="3" fill="#2563EB"/>

  <!-- Keyword Lines (Matched skills) -->
  <rect x="46" y="50" width="36" height="4.5" rx="2.25" fill="#94A3B8"/>
  <rect x="46" y="60" width="32" height="4.5" rx="2.25" fill="#94A3B8"/>
  <rect x="46" y="70" width="36" height="4.5" rx="2.25" fill="#3B82F6"/>
  <rect x="46" y="80" width="20" height="4.5" rx="2.25" fill="#10B981"/>

  <!-- AI Sparkle Beacon Top Right -->
  <path d="M 100 22 Q 100 32 110 32 Q 100 32 100 42 Q 100 32 90 32 Q 100 32 100 22 Z" fill="#FBBF24" filter="url(#sparkleGlow)"/>
</svg>
